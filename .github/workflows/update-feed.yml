name: Refresh and publish portfolio
on:
  push:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check that the original portfolio is present
        run: |
          for file in index.html writing.html nature-podcast.html nature-video.html bbc-inside-science.html assets/style.css; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing $file. Overlay the feed update on the original portfolio."
              exit 1
            fi
          done
      - name: Refresh latest work
        run: |
          if ! node scripts/update-feed.mjs; then
            echo "::warning::Writing source unavailable. Publishing the saved feed."
          fi
      - name: Save refreshed feed for future runs
        run: |
          git add assets/latest-work.json
          if ! git diff --cached --quiet; then
            git -c user.name='Portfolio feed' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh latest work'
            git push
          fi
      - run: node scripts/build-catalogue.mjs
      - name: Stage public files
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio"
          cp ./*.html "$RUNNER_TEMP/portfolio/"
          cp -R assets "$RUNNER_TEMP/portfolio/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/portfolio
      - id: deployment
        uses: actions/deploy-pages@v4
